# BIRD 2 — vetor de distância (RIP), roteador 2
log stderr all;
router id 10.0.20.254;          # identidade única deste roteador: o endereço
                                # de r2 no segmento B. Dois roteadores com o
                                # mesmo id fazem o protocolo confundir quem
                                # anunciou o quê — e 0.0.0.0 não é ninguém.

protocol device { }
protocol direct { ipv4; interface "eth*"; }
protocol kernel { ipv4 { export all; }; learn; }

protocol rip {
  ipv4 { import all; export all; };
  interface "*" { };
}
